name: Daily pipeline

on:
  schedule:
    - cron: "30 0 * * *"   # every day at 00:30 UTC = 06:00 India time
  workflow_dispatch:        # lets you also run it by hand from the Actions tab

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Download data
        run: |
          mkdir -p data
          curl -fL -o data/yellow_tripdata_2026-01.parquet https://d37ci6vzurychx.cloudfront.net/trip-data/yellow_tripdata_2026-01.parquet

      - name: Run tests
        run: pytest

      - name: Run pipeline
        run: python src/pipeline.py